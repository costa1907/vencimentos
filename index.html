<!doctype html>
<!--
  VENCIMENTOS — controle de contas a pagar
  ---------------------------------------------------------------
  v1.2 · 11/10/2026 · Ícones dos apps
   - Ícones reais (recortados do print do iPhone do COSTA) para bancos,
     corretoras, lojas, Spotify e YouTube: na grade de escolha, na lista
     de contas e no topo do cartão
   - Novas empresas: Genial, Rico, Ágora, íon Itaú, Mercado Livre,
     Amazon e Shopee
  v1.1 · 11/10/2026 · Empresas e cartões
   - Escolha rápida de banco, streaming, água, luz, gás, internet, plano de
     saúde, seguro e outros: toque no selo e o nome já vem preenchido
   - Cartão de crédito com arte realista (cor do banco, chip, bandeira,
     nível e final), também em carrossel na tela principal
   - Foto ou logo próprio em qualquer conta
   - Valor diferente em um mês só (fatura do cartão, luz, água)
   - Novos tipos: Internet/Telefone, Saúde, Seguro, Impostos
  v1.0 · 11/10/2026 · Versão inicial
   - Contas únicas, mensais (assinaturas, aluguel, luz...) e parceladas
     (cartão, financiamento, consórcio)
   - Adicionar em poucos toques (valor, tipo, data)
   - Marcar como paga com um toque, desfazer, atrasadas em destaque
   - Panorama dos próximos meses, por tipo e compromissos de longo prazo
   - Backup por copiar/colar, dados salvos no próprio aparelho
   - Instalável na tela de início do iPhone
-->

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Ícone gerado na hora (iOS exige PNG no apple-touch-icon) */
(function(){
  function icon(sz){
    var c=document.createElement('canvas');c.width=c.height=sz;var x=c.getContext('2d');
    var g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#232a44');g.addColorStop(1,'#080a11');
    x.fillStyle=g;x.fillRect(0,0,sz,sz);
    var r=x.createRadialGradient(sz*.5,sz*.38,sz*.02,sz*.5,sz*.5,sz*.62);
    r.addColorStop(0,'rgba(232,178,74,.34)');r.addColorStop(1,'rgba(232,178,74,0)');
    x.fillStyle=r;x.fillRect(0,0,sz,sz);
    x.lineCap='round';x.lineJoin='round';
    x.lineWidth=sz*.065;x.strokeStyle='rgba(255,255,255,.14)';
    x.beginPath();x.arc(sz/2,sz/2,sz*.29,0,Math.PI*2);x.stroke();
    var s=x.createLinearGradient(0,sz*.2,sz,sz*.8);s.addColorStop(0,'#f6d58b');s.addColorStop(1,'#e8b24a');
    x.strokeStyle=s;x.beginPath();x.arc(sz/2,sz/2,sz*.29,-Math.PI/2,Math.PI*1.18);x.stroke();
    x.lineWidth=sz*.075;x.beginPath();
    x.moveTo(sz*.39,sz*.51);x.lineTo(sz*.475,sz*.595);x.lineTo(sz*.62,sz*.42);x.stroke();
    return c.toDataURL('image/png');
  }
  try{
    var a=icon(180);document.getElementById('touchicon').href=a;
    var big=icon(512);
    var man={name:'Vencimentos',short_name:'Vencimentos',start_url:location.href.split('#')[0],display:'standalone',
      background_color:'#0a0c13',theme_color:'#0a0c13',icons:[{src:big,sizes:'512x512',type:'image/png'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
})();
</script>
<style>
/* Layout: cabeçalho + cartão-resumo no topo, lista por situação, barra flutuante embaixo e botão + */
:root{
  --bg:#0a0c13; --bg2:#0f1220; --card:#141828; --card2:#1b2034; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#eef0f7; --mu:#8c93aa; --mu2:#5d647c;
  --gold:#e8b24a; --gold2:#f6d58b; --ok:#34d399; --bad:#fb6f6f; --warn:#f5a524;
  --fd:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif; --fb:'Figtree',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:
   radial-gradient(900px 420px at 80% -8%,rgba(232,178,74,.10),transparent 60%),
   radial-gradient(700px 500px at -10% 30%,rgba(95,130,255,.07),transparent 60%),
   var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 200px}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#262e4d,#0c0f1a);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.brand h1{font:800 21px/1 var(--fd);margin:0;letter-spacing:-.02em}
.pill{font:700 9.5px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:#1a1304;background:linear-gradient(120deg,var(--gold2),var(--gold));padding:5px 8px;border-radius:99px}

/* resumo */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:18px 18px 16px;background:linear-gradient(160deg,#1c2238 0%,#121626 55%,#0f1220 100%);border:1px solid var(--line2);box-shadow:0 24px 50px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:360px;height:360px;background:radial-gradient(circle,rgba(232,178,74,.20),transparent 62%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
.hero::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-18deg);animation:sheen 1.8s .5s var(--ease) 1 both;pointer-events:none}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.12)}}
@keyframes sheen{from{left:-60%}to{left:140%}}
.mnav{position:relative;display:flex;align-items:center;gap:6px;margin-bottom:14px}
.mnav .mn{flex:1;text-align:center;font:700 15px/1 var(--fd);letter-spacing:.01em}
.mnav .mn small{display:block;margin-top:4px;font:500 11px/1 var(--fb);color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.rb{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:transform .25s var(--ease),background .2s}
.rb:active{transform:scale(.9);background:rgba(255,255,255,.1)}
.hrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hnum .lb{font:600 11px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.hnum .big{font:800 clamp(30px,9.2vw,40px)/1.05 var(--fd);letter-spacing:-.035em;margin-top:8px;background:linear-gradient(180deg,#fff,#d9dcea);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.hnum .sub{margin-top:8px;color:var(--mu);font-size:12.5px}
.hnum .sub b{color:var(--tx);font-weight:600}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.08)}
.ring .pr{stroke:url(#rg);transition:stroke-dashoffset 1.1s var(--ease);filter:drop-shadow(0 0 8px rgba(232,178,74,.35))}
.ring .ct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:800 22px/1 var(--fd)}
.ring .ct small{display:block;font:500 9.5px/1 var(--fb);color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.st{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:10px 11px;min-width:0}
.st span{display:block;font:600 10px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.st b{display:block;margin-top:7px;font:700 14px/1.1 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.bad b{color:var(--bad)} .st.ok b{color:var(--ok)}
.todaybtn{margin:12px auto 0;display:none;padding:8px 14px;border-radius:99px;background:rgba(232,178,74,.12);color:var(--gold2);font:600 12.5px var(--fb);border:1px solid rgba(232,178,74,.25)}
.todaybtn.show{display:block}

/* lista */
.sec{margin-top:24px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 4px 10px;font:700 13px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.sec h3 em{font-style:normal;background:rgba(255,255,255,.08);color:var(--tx);border-radius:99px;padding:3px 8px;font-size:11px;letter-spacing:0}
.sec h3 span{margin-left:auto;letter-spacing:0;text-transform:none;font:600 13px var(--fb)}
.sec.late h3{color:var(--bad)} .sec.late h3 em{background:rgba(251,111,111,.16);color:var(--bad)}
.sec.done h3{color:var(--ok)}
.group{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px 13px 12px;cursor:pointer;transition:background .2s;animation:rin .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:rgba(255,255,255,.04)}
.noanim .row{animation:none}
@keyframes rin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;transition:all .3s var(--ease);position:relative}
.chk svg{width:16px;height:16px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .05s var(--ease)}
.chk::after{content:"";position:absolute;inset:-8px}
.row.late .chk{border-color:rgba(251,111,111,.55)}
.row.paid .chk{background:linear-gradient(140deg,#5ee9b5,var(--ok));border-color:transparent;color:#052018;box-shadow:0 4px 14px rgba(52,211,153,.35)}
.row.paid .chk svg{stroke-dashoffset:0}
.chk.pop{animation:pop .55s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
.ico{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{display:block;margin-top:3px;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.late .mid span{color:var(--bad)}
.row.today .mid span{color:var(--warn)}
.row.paid .mid b{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.amt{flex:none;font:700 15px var(--fd);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.row.paid .amt{color:var(--mu)}

.empty{margin-top:28px;text-align:center;padding:34px 20px;border-radius:26px;border:1px dashed var(--line2);background:rgba(255,255,255,.02)}
.empty svg{margin:0 auto 14px}
.empty h4{margin:0 0 6px;font:700 18px var(--fd)} .empty p{margin:0 0 18px;color:var(--mu);line-height:1.5}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:16px;background:linear-gradient(120deg,var(--gold2),var(--gold));color:#1a1304;font:700 14.5px var(--fb);box-shadow:0 10px 26px -8px rgba(232,178,74,.6)}
.cta:active{transform:scale(.97)}
.cheer{margin-top:18px;padding:14px 16px;border-radius:18px;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.25);color:#9af0cc;font-weight:600;text-align:center}

/* barra e botão + */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 32px);max-width:420px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:26px;background:rgba(20,24,40,.78);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line2);box-shadow:0 18px 40px -10px rgba(0,0,0,.7);z-index:20}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:20px;background:rgba(255,255,255,.08);transition:transform .45s var(--ease)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;color:var(--mu2);font:600 10.5px var(--fb);letter-spacing:.03em;transition:color .25s}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold2)}
.fab{position:fixed;right:max(20px,calc(50% - 270px));bottom:calc(env(safe-area-inset-bottom,0px) + 94px);width:62px;height:62px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#c98f2a);color:#1a1304;box-shadow:0 16px 34px -8px rgba(232,178,74,.65),inset 0 1px 0 rgba(255,255,255,.5);z-index:21;transition:transform .3s var(--ease)}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}
.fab::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--gold);animation:ping 3s 1.5s ease-out infinite;pointer-events:none}
@keyframes ping{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(1.5);opacity:0}}
.page[hidden]{display:none}
.page{animation:pgin .5s var(--ease)}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* painel de cadastro */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(3,4,8,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .35s}
.panel{position:absolute;left:50%;bottom:0;width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;transform:translate(-50%,102%);transition:transform .45s var(--ease);background:linear-gradient(180deg,#191e32,#111423);border:1px solid var(--line2);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 22px);box-shadow:0 -30px 60px rgba(0,0,0,.5)}
.sheet.open .scrim{opacity:1} .sheet.open .panel{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 12px}
.stitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.stitle h2{margin:0;font:800 20px var(--fd);letter-spacing:-.02em}
.x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center}
.x svg{width:16px;height:16px;stroke:var(--mu);stroke-width:2.4;stroke-linecap:round}
.amtbox{display:block;text-align:center;padding:16px 0 12px}
.amtbox span{display:block;font:600 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.amtbox input{width:100%;text-align:center;background:none;border:0;outline:0;font:800 44px/1.1 var(--fd);letter-spacing:-.03em;color:var(--tx);caret-color:var(--gold);font-variant-numeric:tabular-nums}
.amtbox.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fld{width:100%;height:50px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:0 14px;outline:0;transition:border-color .2s,background .2s}
.fld:focus{border-color:rgba(232,178,74,.55);background:rgba(255,255,255,.07)}
textarea.fld{height:76px;padding:12px 14px;resize:none;line-height:1.4}
.lbl{margin:16px 2px 8px;font:600 11px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 2px 9px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mu);font:600 10.5px var(--fb);transition:all .25s var(--ease);min-width:0}
.cat svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.on{color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-2px)}
.dates{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font:600 13px var(--fb);color:var(--mu);transition:all .25s var(--ease)}
.chip.on{background:rgba(232,178,74,.14);border-color:rgba(232,178,74,.5);color:var(--gold2)}
.dates input[type=date]{flex:1;min-width:150px;height:44px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:0 12px;outline:0;color:var(--tx)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{height:40px;border-radius:12px;font:600 13px var(--fb);color:var(--mu);transition:all .3s var(--ease)}
.seg button.on{background:linear-gradient(120deg,rgba(246,213,139,.95),rgba(232,178,74,.95));color:#1a1304}
.inst{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stp{display:flex;align-items:center;justify-content:space-between;padding:6px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stp small{display:block;font:600 10px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding-left:8px}
.stp .v{padding-left:8px;font:800 18px var(--fd)}
.stp .bt{display:flex;gap:4px}
.stp .bt button{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.07);font:700 18px var(--fb);line-height:1}
.stp .bt button:active{transform:scale(.88)}
.hint{margin:8px 4px 0;font-size:12px;color:var(--mu);line-height:1.45}
.save{width:100%;margin-top:20px;height:56px;border-radius:19px;background:linear-gradient(120deg,var(--gold2),var(--gold));color:#1a1304;font:800 16px var(--fd);box-shadow:0 14px 30px -10px rgba(232,178,74,.7);transition:transform .2s}
.save:active{transform:scale(.98)}
.act{width:100%;height:48px;margin-top:10px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font:600 14px var(--fb);transition:all .2s}
.act.ok{color:var(--ok);border-color:rgba(52,211,153,.4)}
.act.danger{color:var(--bad);border-color:rgba(251,111,111,.35)}
.act.armed{background:var(--bad);color:#fff;border-color:transparent}

/* panorama e ajustes */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:16px}
.card h3{margin:0 0 4px;font:700 16px var(--fd)}
.card .cap{color:var(--mu);font-size:12.5px;margin-bottom:14px;line-height:1.45}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;cursor:default}
.bc .v{font:700 11px var(--fb);color:var(--mu);white-space:nowrap}

function badge(p){

}

function lead(b){

/* ---------- dados ---------- */
let S={bills:[]};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.bills))S=o}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const now0=new Date();
let V={y:now0.getFullYear(),m:now0.getMonth()}; /* mês em exibição */
let TAB='home', ANIM=true;

function occ(b,y,m){
  const s=fromISO(b.due), idx=y*12+m, diff=idx-(s.getFullYear()*12+s.getMonth());
  if(diff<0) return null;
  if(b.endKey){const e=b.endKey.split('-').map(Number); if(idx>e[0]*12+(e[1]-1)) return null}
  if(b.repeat==='once'&&diff!==0) return null;
  if(b.repeat==='inst'&&diff>=b.total) return null;
  const day=Math.min(b.day||s.getDate(),dim(y,m));
  const key=mkey(y,m);
  const ov=b.ov&&b.ov[key];
  return {b:b,key:key,date:new Date(y,m,day),n:diff+1,paid:b.paid[key]||null,amt:ov!=null?ov:b.amount};
}
const monthOccs=(y,m)=>S.bills.map(b=>occ(b,y,m)).filter(Boolean);
function overdueAll(){
  const t=today0(), ni=t.getFullYear()*12+t.getMonth(), out=[];
  S.bills.forEach(b=>{
    const s=fromISO(b.due), si=s.getFullYear()*12+s.getMonth();
    for(let i=Math.max(si,ni-36);i<=ni;i++){
      const o=occ(b,Math.floor(i/12),i%12);
      if(o&&!o.paid&&o.date<t) out.push(o);
    }
  });
  return out.sort((a,b)=>a.date-b.date);
}
const sum=a=>a.reduce((s,o)=>s+o.amt,0);

function whenText(o){
  const t=today0();
  if(o.paid){const d=fromISO(o.paid);return 'paga em '+p2(d.getDate())+'/'+p2(d.getMonth()+1)}
  const d=ddiff(o.date,t);
  if(d===0) return 'vence hoje';
  if(d===1) return 'vence amanhã';
  if(d>1&&d<=14) return 'vence em '+d+' dias';
  if(d<0) return 'venceu há '+(-d)+(d===-1?' dia':' dias');
  return 'vence '+p2(o.date.getDate())+' '+MS[o.date.getMonth()];
}

/* ---------- animações ---------- */
function tween(el,to,fmt,ms){
  if(!el) return;
  const from=Number(el.dataset.v||0); el.dataset.v=to;
  if(from===to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fmt(to);return}
  const t0=performance.now(); ms=ms||700;
  (function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f);else el.textContent=fmt(to)})(t0);
}
function burst(x,y){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c=document.createElement('canvas');c.className='fx';const dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);
  const g=c.getContext('2d');g.scale(dpr,dpr);
  const cols=['#f6d58b','#e8b24a','#34d399','#5ee9b5','#ffffff'];
  const P=Array.from({length:34},()=>{const a=Math.random()*Math.PI*2,v=2+Math.random()*5.5;return{x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.5,r:2+Math.random()*3,c:cols[Math.random()*cols.length|0],l:1}});
  const t0=performance.now();
  (function f(t){
    const k=(t-t0)/900;g.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.985;g.globalAlpha=Math.max(0,1-k);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});
    if(k<1)requestAnimationFrame(f);else c.remove();
  })(t0);
}
let tt;
function toast(msg,undo){
  const el=$('#toast'),b=$('#tact');$('#tmsg').textContent=msg;
  b.hidden=!undo;b.onclick=()=>{el.classList.remove('show');undo&&undo()};
  el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),undo?4500:2400);
}

function section(cls,title,arr,start){

function cardGroups(mo){
  const g={}, kk=b=>(b.prov||b.name)+'|'+(b.last4||'');
  S.bills.filter(b=>b.cat==='cartao').forEach(b=>{const k=kk(b);if(!g[k])g[k]={b:b,occ:[]}});
  mo.forEach(o=>{if(o.b.cat==='cartao'){const k=kk(o.b);if(g[k])g[k].occ.push(o)}});
  return Object.keys(g).map(k=>g[k]);
}
function cardsHTML(gs){
  if(!gs.length) return '';

  return '<div class="sec"><h3>Cartões <em>'+gs.length+'</em></h3><div class="cards">'+gs.map((g,i)=>{
    const tot=sum(g.occ), allp=g.occ.length&&g.occ.every(o=>o.paid);

/* ---------- panorama ---------- */
function renderPan(){
  const t=today0(), ty=t.getFullYear(), tm=t.getMonth();
  const mths=[];for(let i=0;i<6;i++){const d=new Date(ty,tm+i,1),o=monthOccs(d.getFullYear(),d.getMonth());mths.push({l:MS[d.getMonth()],tot:sum(o),pd:sum(o.filter(x=>x.paid)),cur:i===0})}
  const mx=Math.max(1,...mths.map(x=>x.tot));
  const bars=mths.map((x,i)=>'<div class="bc'+(x.cur?' cur':'')+'"><div class="v num">'+(x.tot?short(x.tot):'')+'</div><div class="b" style="height:'+Math.max(4,Math.round(x.tot/mx*118))+'px;--i:'+i+'">'+(x.tot&&x.pd?'<i style="height:'+Math.round(x.pd/x.tot*100)+'%"></i>':'')+'</div><div class="m">'+x.l+'</div></div>').join('');
  const mo=monthOccs(V.y,V.m), byc={};mo.forEach(o=>{byc[o.b.cat]=(byc[o.b.cat]||0)+o.amt});
  const cl=Object.keys(byc).sort((a,b)=>byc[b]-byc[a]), ct=sum(mo)||1;
  const cats=cl.length?cl.map((k,i)=>{const c=CAT[k]||CAT.outros;return '<div class="hb" style="--c:'+c.c+'"><div class="t"><b>'+c.l+'</b><span class="num">'+brl(byc[k])+' · '+Math.round(byc[k]/ct*100)+'%</span></div><div class="tr"><i style="width:'+Math.max(3,byc[k]/ct*100)+'%;--i:'+i+'"></i></div></div>'}).join(''):'<p class="cap">Sem contas em '+MES[V.m]+'.</p>';
  const inst=S.bills.filter(b=>b.repeat==='inst'&&b.total>=2);
  let remain=0;
  const lt=inst.map((b,i)=>{
    const done=Object.keys(b.paid).length, left=Math.max(0,b.total-done); remain+=left*b.amount;
    const c=CAT[b.cat]||CAT.outros;
    return '<div class="hb" style="--c:'+c.c+'"><div class="t"><b>'+esc(b.name)+'</b><span class="num">'+done+'/'+b.total+' · faltam '+brl(left*b.amount)+'</span></div><div class="tr"><i style="width:'+Math.max(3,done/b.total*100)+'%;--i:'+i+'"></i></div></div>';
  }).join('');

  const commit=sum(rec.map(b=>({amt:b.amount})))+sum(S.bills.filter(b=>b.repeat==='inst'&&Object.keys(b.paid).length<b.total).map(b=>({amt:b.amount})));
  $('#pan').innerHTML=
   '<div class="card"><h3>Próximos 6 meses</h3><div class="cap">Total de contas por mês. A parte verde já foi paga.</div><div class="bars">'+bars+'</div><div class="lg"><span><i style="background:var(--ok)"></i>Pago</span><span><i style="background:rgba(255,255,255,.2)"></i>A pagar</span></div></div>'+
   '<div class="kpi"><div><span>Fixo por mês</span><b class="num">'+brl(commit)+'</b></div><div><span>Dívida parcelada</span><b class="num">'+brl(remain)+'</b></div></div>'+
   '<div class="card"><h3>Por tipo em '+MES[V.m]+'</h3><div class="cap">Para onde o dinheiro do mês está indo.</div>'+cats+'</div>'+
   '<div class="card"><h3>Financiamentos e parcelas</h3><div class="cap">Quanto já foi pago de cada compromisso.</div>'+(lt||'<p class="cap">Nada parcelado ainda. Ao adicionar uma conta, escolha Parcelada.</p>')+'</div>';
}

  $('#fa').value=fmtAmt(F.cents);
  $$('#fc .cat').forEach(b=>b.classList.toggle('on',b.dataset.c===F.cat));
  $$('#fr button').forEach(b=>b.classList.toggle('on',b.dataset.r===F.rep));
  $('#inst').hidden=F.rep!=='inst';
  $('#curbox').hidden=!!EDIT;
  $('#vt').textContent=F.total;$('#vc').textContent=F.cur;
  $('#fdl').textContent=F.rep==='once'?'Vencimento':(F.rep==='monthly'?'Primeiro vencimento':'Vencimento da 1ª parcela');
  $('#scopebox').hidden=!(EDIT&&F.rep!=='once');
  $$('#fs2 button').forEach(b=>b.classList.toggle('on',b.dataset.sc===F.scope));
  const cc=F.cat==='cartao';
  $('#ccx').hidden=!cc;
  if(cc){
    $('#ccprev').innerHTML=cardArt({prov:F.prov,tier:F.tier,brand:F.brand,last4:F.last4,name:$('#fn').value},false);
    $$('#cb .chip').forEach(c=>c.classList.toggle('on',c.dataset.b===F.brand));
    $$('#ct .chip').forEach(c=>c.classList.toggle('on',c.dataset.t===F.tier));
  }
  $('#pprev').innerHTML=okImg(F.img)?'<img alt="" src="'+F.img+'">':'';
  $('#pimg').textContent=okImg(F.img)?'Trocar minha imagem':'Usar minha foto ou logo';
  $('#pdel').hidden=!okImg(F.img);
  const d=$('#fd').value;
  $$('#fdates .chip').forEach(c=>{const x=new Date();x.setDate(x.getDate()+Number(c.dataset.d));c.classList.toggle('on',d===toISO(x))});
  let h='';
  if(F.rep==='monthly') h='Repete todo mês no mesmo dia, sem data final. Encerre quando quiser.';
  if(F.rep==='inst'&&!EDIT) h=F.cur>1?'Parcelas anteriores à '+F.cur+'ª já entram como pagas.':'Informe a parcela atual se a compra já começou.';
  $('#hint').textContent=h;$('#hint').style.display=h?'':'none';
  $('#fcopy').hidden=!$('#fo').value.trim();
}
function openSheet(id,key){
  EDIT=null;const sh=$('#sheet'),pn=$('#panel');
  const b=id?S.bills.find(v=>v.id===id):null;
  F={cents:0,cat:'boleto',rep:'once',total:12,cur:1,prov:'',brand:'visa',tier:'standard',last4:'',img:'',auto:'',scope:'all',touched:false};
  $('#fn').value='';$('#fo').value='';$('#fd').value=toISO(today0());$('#cl').value='';$('#ps').value='';
  $('#extra').innerHTML='';
  if(b){
    const o=occ(b,...key.split('-').map((v,i)=>i?Number(v)-1:Number(v)));
    EDIT={id:b.id,key:key,orig:o?o.amt:b.amount};
    F={cents:EDIT.orig,cat:b.cat,rep:b.repeat,total:b.total||12,cur:1,prov:b.prov||'',brand:b.brand||'visa',tier:b.tier||'standard',last4:b.last4||'',img:okImg(b.img)?b.img:'',auto:PROV[b.prov]?PROV[b.prov].n:'',scope:VARIAVEL.indexOf(b.cat)>-1?'one':'all',touched:true};
    $('#fn').value=b.name;$('#fo').value=b.note||'';$('#fd').value=b.due;$('#cl').value=F.last4;
    $('#st').textContent='Editar conta';$('#fs').textContent='Salvar alterações';
    let ex='';
    if(o) ex+='<button type="button" class="act ok" id="xpay">'+(o.paid?'Desfazer pagamento deste mês':'Marcar este mês como paga')+'</button>';
    if(b.repeat!=='once') ex+='<button type="button" class="act" id="xend">Encerrar a partir deste mês</button>';
    ex+='<button type="button" class="act danger" id="xdel">Excluir conta</button>';
    $('#extra').innerHTML=ex;
  } else {
    $('#st').textContent='Nova conta';$('#fs').textContent='Adicionar conta';
  }
  sh.hidden=false;void sh.offsetWidth;sh.classList.add('open');
  document.body.style.overflow='hidden';pn.scrollTop=0;
  renderProv();syncForm();
  if(!b)setTimeout(()=>{const a=$('#fa');a.focus();const l=a.value.length;try{a.setSelectionRange(l,l)}catch(e){}},380);
}
function closeSheet(){
  const sh=$('#sheet');sh.classList.remove('open');document.body.style.overflow='';
  $('#fa').blur();setTimeout(()=>{if(!sh.classList.contains('open'))sh.hidden=true},430);
  $('#panel').style.transform='';
}
$('#scrim').onclick=closeSheet;$('#sx').onclick=closeSheet;
$('#fa').addEventListener('input',e=>{
  const d=e.target.value.replace(/\D/g,'').slice(0,11);
  F.cents=d?parseInt(d,10):0;e.target.value=fmtAmt(F.cents);
  const l=e.target.value.length;try{e.target.setSelectionRange(l,l)}catch(_){}
});
$('#fa').addEventListener('focus',e=>{const l=e.target.value.length;setTimeout(()=>{try{e.target.setSelectionRange(l,l)}catch(_){}},0)});
$('#fc').addEventListener('click',e=>{
  const b=e.target.closest('.cat');if(!b)return;
  F.cat=b.dataset.c;
  if(!EDIT&&!F.touched)F.rep=AUTOM.indexOf(F.cat)>-1?'monthly':'once';
  if(F.prov&&(LIST[F.cat]||[]).indexOf(F.prov)<0){
    if($('#fn').value===F.auto)$('#fn').value='';
    F.auto='';F.prov='';
  }
  $('#ps').value='';renderProv();syncForm();
});
$('#ps').addEventListener('input',renderProv);
$('#pg').addEventListener('click',e=>{
  const t=e.target.closest('.pt');if(!t)return;
  const id=t.dataset.p, q=($('#ps').value||'').trim();
  let catChanged=false;
  if(id&&(LIST[F.cat]||[]).indexOf(id)<0&&PCAT[id]){
    F.cat=PCAT[id];catChanged=true;
    if(!EDIT&&!F.touched)F.rep=AUTOM.indexOf(F.cat)>-1?'monthly':'once';
  }
  const p=PROV[id], fn=$('#fn');
  if(p){if(!fn.value.trim()||fn.value===F.auto)fn.value=p.n;F.auto=p.n}
  else{if(fn.value===F.auto)fn.value='';F.auto=''}
  F.prov=id||'';
  if(q||catChanged){$('#ps').value='';renderProv()}
  else $$('#pg .pt').forEach(x=>x.classList.toggle('on',x.dataset.p===(F.prov||'')));
  syncForm();
});
$('#ccx').addEventListener('click',e=>{
  const b=e.target.closest('[data-b]'),t=e.target.closest('[data-t]');
  if(b){F.brand=b.dataset.b;syncForm()}
  if(t){F.tier=t.dataset.t;syncForm()}
});
$('#cl').addEventListener('input',e=>{F.last4=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=F.last4;syncForm()});
$('#fn').addEventListener('input',()=>{if(F.cat==='cartao')syncForm()});
$('#pimg').onclick=()=>$('#pfile').click();
$('#pdel').onclick=()=>{F.img='';syncForm()};
$('#pfile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const s=88,c=document.createElement('canvas');c.width=c.height=s;
      const x=c.getContext('2d'),m=Math.min(im.width,im.height);
      x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
      F.img=c.toDataURL('image/png');syncForm();
    };
    im.onerror=()=>toast('Imagem inválida');
    im.src=r.result;
  };
  r.readAsDataURL(f);e.target.value='';
});
$('#fs2').addEventListener('click',e=>{const b=e.target.closest('button');if(b){F.scope=b.dataset.sc;syncForm()}});
$('#fr').addEventListener('click',e=>{const b=e.target.closest('button');if(b){F.rep=b.dataset.r;F.touched=true;syncForm()}});
$('#fdates').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){const d=new Date();d.setDate(d.getDate()+Number(c.dataset.d));$('#fd').value=toISO(d);syncForm()}});
$('#fd').addEventListener('change',syncForm);
$('#fo').addEventListener('input',()=>{$('#fcopy').hidden=!$('#fo').value.trim()});
$('#inst').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b)return;
  const s=b.dataset.s;
  if(s==='t-')F.total=Math.max(2,F.total-1);
  if(s==='t+')F.total=Math.min(480,F.total+1);
  if(s==='c-')F.cur=Math.max(1,F.cur-1);
  if(s==='c+')F.cur=Math.min(F.total,F.cur+1);
  if(F.cur>F.total)F.cur=F.total;
  syncForm();
});
$('#fcopy').onclick=async function(){
  try{await navigator.clipboard.writeText($('#fo').value);this.textContent='Copiado';setTimeout(()=>this.textContent='Copiar observação',1600)}
  catch(e){$('#fo').select()}
};
function putExtra(b){
  if(F.prov)b.prov=F.prov;else delete b.prov;
  if(okImg(F.img))b.img=F.img;else delete b.img;
  if(F.cat==='cartao'){b.brand=F.brand;b.tier=F.tier;b.last4=F.last4}
  else{delete b.brand;delete b.tier;delete b.last4}
}
$('#panel').addEventListener('submit',e=>{
  e.preventDefault();
  if(!F.cents){const a=$('#amtbox');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');$('#fa').focus();return}
  const pv=PROV[F.prov];
  const name=$('#fn').value.trim()||(pv?pv.n:CAT[F.cat].l), due=$('#fd').value||toISO(today0()), note=$('#fo').value.trim();
  if(EDIT){
    const b=S.bills.find(v=>v.id===EDIT.id);
    if(F.cents!==EDIT.orig){
      if(F.rep!=='once'&&F.scope==='one'){b.ov=b.ov||{};b.ov[EDIT.key]=F.cents}
      else{b.amount=F.cents;if(b.ov)delete b.ov[EDIT.key]}
    }
    b.name=name;b.cat=F.cat;b.repeat=F.rep;b.due=due;b.day=fromISO(due).getDate();b.note=note;
    if(F.rep==='inst')b.total=F.total;else delete b.total;
    putExtra(b);
    save();closeSheet();renderAll();toast('Alterações salvas');return;
  }
  const s=fromISO(due),day=s.getDate();
  const b={id:uid(),name:name,amount:F.cents,cat:F.cat,repeat:F.rep,due:due,day:day,note:note,paid:{}};
  putExtra(b);
  if(F.rep==='inst'){
    b.total=F.total;
    if(F.cur>1){
      const first=new Date(s.getFullYear(),s.getMonth()-(F.cur-1),1);
      b.due=toISO(new Date(first.getFullYear(),first.getMonth(),Math.min(day,dim(first.getFullYear(),first.getMonth()))));
      for(let i=0;i<F.cur-1;i++){
        const d=new Date(first.getFullYear(),first.getMonth()+i,1);
        b.paid[mkey(d.getFullYear(),d.getMonth())]=toISO(new Date(d.getFullYear(),d.getMonth(),Math.min(day,dim(d.getFullYear(),d.getMonth()))));
      }
    }
  }
  S.bills.push(b);save();closeSheet();
  const o=fromISO(due);V={y:o.getFullYear(),m:o.getMonth()};
  if(F.rep==='inst'&&F.cur>1){const t=today0();V={y:t.getFullYear(),m:t.getMonth()}}
  if(TAB!=='home')setTab('home');else{ANIM=true;renderHome()}
  toast('Conta adicionada');
});
$('#extra').addEventListener('click',function(e){
  const b=e.target.closest('button');if(!b||!EDIT)return;
  const bill=S.bills.find(v=>v.id===EDIT.id);if(!bill)return;
  if(b.id==='xpay'){const k=EDIT.key;closeSheet();togglePaid(bill.id,k,innerWidth/2,innerHeight*.6)}
  if(b.id==='xend'){
    const p=EDIT.key.split('-').map(Number), prev=new Date(p[0],p[1]-2,1), s=fromISO(bill.due);
    if(prev.getFullYear()*12+prev.getMonth()<s.getFullYear()*12+s.getMonth()){S.bills=S.bills.filter(v=>v.id!==bill.id);toast('Conta removida')}
    else{bill.endKey=mkey(prev.getFullYear(),prev.getMonth());toast('Recorrência encerrada')}
    save();closeSheet();renderAll();
  }
  if(b.id==='xdel'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo para excluir';setTimeout(()=>{b.classList.remove('armed');b.textContent='Excluir conta'},3500);return}
    const copy=JSON.parse(JSON.stringify(bill));
    S.bills=S.bills.filter(v=>v.id!==bill.id);save();closeSheet();renderAll();
    toast('Conta excluída',()=>{S.bills.push(copy);save();renderAll()});
  }
});
/* arrastar o painel para baixo para fechar */
(function(){
  const pn=$('#panel');let y0=null,dy=0;
  pn.addEventListener('touchstart',e=>{if(e.target.closest('.grab,.stitle')&&pn.scrollTop<=0){y0=e.touches[0].clientY;dy=0;pn.style.transition='none'}},{passive:true});
  pn.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);pn.style.transform='translate(-50%,'+dy+'px)'},{passive:true});
  pn.addEventListener('touchend',()=>{if(y0===null)return;pn.style.transition='';const c=dy>110;y0=null;if(c)closeSheet();else pn.style.transform=''});
})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
/* ao voltar para o app, atualiza o "hoje" */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TAB==='home'){ANIM=false;renderHome()}});

setTab('home');
})();
</script>
</body>
</html>
